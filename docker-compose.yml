version: '3.8'

services:
  react-app:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_IMAGES_BASE_URL: ${VITE_IMAGES_BASE_URL:-}
        VITE_IMAGE_UPLOAD_URL: ${VITE_IMAGE_UPLOAD_URL:-https://api-centralizador.apiworking.pe/api/Data/images}
        VITE_BD_NAME: ${VITE_BD_NAME:-}
        VITE_WHATSAPP_PHONE: ${VITE_WHATSAPP_PHONE:-}
    container_name: react-donpepito
    ports:
      - "3000:80"
    restart: always
